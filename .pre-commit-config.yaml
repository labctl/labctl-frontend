repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.1.0
    hooks:
      - id: codespell
        args:
          - -L
          - ASend,asend
          - --skip
          - "package-lock.json,*.mod"
        exclude: ^src/utils/icon_codepoints.ts$

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm run lint
        language: node
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: npm run format
        language: node
        pass_filenames: false

      - id: vitest
        name: vitest
        entry: npm run test
        language: node
        pass_filenames: false

